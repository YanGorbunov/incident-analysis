spring:
  application:
    name: incident-analytics
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/incidents}
    username: ${DB_USER:incidents}
    password: ${DB_PASSWORD:incidents}
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
  jackson:
    default-property-inclusion: non_null

server:
  shutdown: graceful
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  # Часовой пояс бизнес-дня: от него зависит дата в коде инцидента ГГММДД.XXXX
  zone: Europe/Moscow
  security:
    max-failed-attempts: 5
    lock-duration: 15m
    totp-issuer: Incident Analytics
  # Начальный администратор создаётся, если пользователей ещё нет.
  bootstrap-admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
  tracker:
    # fixture — встроенные тестовые данные (classpath:tracker/fixtures.json)
    # http    — внешняя система управления задачами по REST
    mode: fixture
    base-url: ${TRACKER_URL:http://localhost:8090}
    token: ${TRACKER_TOKEN:}
    priority-mapping:
      Blocker: "01"
      Critical: "01"
      Major: "02"
      Normal: "03"
      Minor: "04"
      Trivial: "05"
    status-mapping:
      Open: "01"
      Waiting: "02"
      Assigned: "03"
      "[In Progress]": "04"
      Resolved: "05"
      Closed: "06"

---
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration, classpath:db/demo
app:
  bootstrap-admin:
    password: ${ADMIN_PASSWORD:admin}
  demo-users: true
